name: Build Android APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:  # Allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Install npm dependencies
        run: npm install

      # 防止 www 下的 APK 被 cap sync 打进新 APK 造成「套娃」体积膨胀
      - name: Strip APK files from web assets
        run: rm -f www/*.apk

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup local.properties for Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Copy Android icons
        run: |
          for dir in android-res/mipmap-*; do
            dname=$(basename "$dir")
            cp "$dir"/*.png "android/app/src/main/res/$dname/"
          done

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yingling-workbench-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  deploy-pages:
    runs-on: ubuntu-latest
    needs: []  # Runs in parallel with APK build, no dependency
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./www
          publish_branch: gh-pages
          allow_empty_commit: false
          # 保留 gh-pages 上已发布的 APK，避免网页先上线时下载地址短暂 404
          keep_files: true

  # 构建成功后，把最新 APK 自动追加发布到 gh-pages，
  # 覆盖 www/ 里那份兜底 APK，实现「推代码 = APK 自动更新」
  publish-apk:
    runs-on: ubuntu-latest
    needs: [build, deploy-pages]
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: yingling-workbench-debug
          path: apk-download

      - name: Prepare publish folder
        run: |
          mkdir -p apk-out
          cp apk-download/app-debug.apk "apk-out/自洽日程.apk"
          BUILT_AT="$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"
          SIZE_MB="$(awk "BEGIN{printf \"%.1f\", $(stat -c %s "apk-out/自洽日程.apk")/1048576}")"
          printf '{"commit":"%s","shortSha":"%s","builtAt":"%s","sizeMB":%s}\n' \
            "${GITHUB_SHA}" "${GITHUB_SHA:0:7}" "${BUILT_AT}" "${SIZE_MB}" \
            > apk-out/apk-info.json
          cat apk-out/apk-info.json

      - name: Publish APK to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apk-out
          publish_branch: gh-pages
          keep_files: true
          allow_empty_commit: false
          commit_message: "auto: 发布最新 APK (${{ github.sha }})"
