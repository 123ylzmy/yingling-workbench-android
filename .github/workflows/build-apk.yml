name: Build Android APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:  # Allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Install npm dependencies
        run: npm install

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup local.properties for Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Copy Android icons
        run: |
          for dir in android-res/mipmap-*; do
            dname=$(basename "$dir")
            cp "$dir"/*.png "android/app/src/main/res/$dname/"
          done

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yingling-workbench-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  deploy-pages:
    runs-on: ubuntu-latest
    needs: []  # Runs in parallel with APK build, no dependency
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./www
          publish_branch: gh-pages
          allow_empty_commit: false
          force_orphan: true
