<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#7EB89A">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>登录 — 自洽日程</title>
  <style>
    :root {
      --bg: #FAF7F2; --card: #FFFFFF; --accent: #7EB89A; --accent-hover: #6DAB8A;
      --text: #3D3D3D; --text-secondary: #888888; --line: #EBE5DC;
      --input-bg: #F5F2EC; --input-border: #E0D9CC; --error: #E06C6C; --radius: 14px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh; min-height: 100dvh;
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    body::before { content:''; position:fixed; top:-120px; right:-80px; width:300px; height:300px;
      background:radial-gradient(circle, rgba(126,184,154,0.12) 0%, transparent 70%); border-radius:50%; pointer-events:none; }
    body::after { content:''; position:fixed; bottom:-100px; left:-60px; width:250px; height:250px;
      background:radial-gradient(circle, rgba(180,160,140,0.10) 0%, transparent 70%); border-radius:50%; pointer-events:none; }

    .container { width:100%; max-width:420px; position:relative; z-index:1; animation:fadeIn 0.5s ease; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }

    .logo-area { text-align:center; margin-bottom:20px; }
    .logo-icon { width:56px; height:56px; border-radius:18px; object-fit:cover; margin-bottom:8px;
      box-shadow:0 4px 20px rgba(126,184,154,0.25); }
    .logo-title { font-size:20px; font-weight:600; color:var(--text); }
    .logo-sub { font-size:13px; color:var(--text-secondary); margin-top:2px; }

    .card { background:var(--card); border-radius:var(--radius); padding:24px 22px;
      box-shadow:0 2px 16px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.03); }

    .tabs { display:flex; gap:0; margin-bottom:18px; background:var(--input-bg); border-radius:10px; padding:3px; }
    .tab-btn { flex:1; padding:9px 0; border:none; background:transparent; border-radius:8px;
      font-size:14px; font-weight:500; color:var(--text-secondary); cursor:pointer; transition:all 0.2s; }
    .tab-btn.active { background:var(--card); color:var(--text); box-shadow:0 1px 4px rgba(0,0,0,0.06); }

    .form { display:none; }
    .form.active { display:block; }

    .form-group { margin-bottom:12px; }
    .form-label { display:block; font-size:13px; font-weight:500; color:var(--text); margin-bottom:4px; }
    .form-input, .form-select { width:100%; padding:10px 12px; border:1.5px solid var(--input-border);
      border-radius:10px; background:var(--input-bg); font-size:15px; color:var(--text);
      outline:none; transition:border-color 0.2s, box-shadow 0.2s; -webkit-appearance:none; }
    .form-input:focus, .form-select:focus { border-color:var(--accent);
      box-shadow:0 0 0 3px rgba(126,184,154,0.10); background:#fff; }
    .form-row { display:flex; gap:10px; }
    .form-row > .form-group { flex:1; }

    .code-row { display:flex; gap:8px; }
    .code-row .form-input { flex:1; }
    .code-btn { padding:10px 14px; border:1.5px solid var(--accent); border-radius:10px;
      background:transparent; color:var(--accent); font-size:13px; font-weight:600;
      cursor:pointer; white-space:nowrap; transition:all 0.2s; min-width:90px; }
    .code-btn:hover { background:rgba(126,184,154,0.08); }
    .code-btn:disabled { border-color:var(--input-border); color:var(--text-secondary); cursor:not-allowed; }

    .login-modes { display:flex; gap:0; margin-bottom:14px; }
    .mode-btn { flex:1; padding:7px 0; border:none; background:transparent;
      font-size:13px; color:var(--text-secondary); cursor:pointer; position:relative;
      transition:color 0.2s; }
    .mode-btn.active { color:var(--accent); font-weight:600; }
    .mode-btn.active::after { content:''; position:absolute; bottom:-4px; left:50%; transform:translateX(-50%);
      width:24px; height:2.5px; background:var(--accent); border-radius:2px; }

    .remember-row { display:flex; align-items:center; gap:8px; margin-bottom:16px; }
    .remember-row input[type="checkbox"] { accent-color:var(--accent); width:16px; height:16px; }
    .remember-row label { font-size:13px; color:var(--text-secondary); cursor:pointer; }

    .avatar-picker { display:grid; grid-template-columns: repeat(6, 1fr); gap:6px; margin-top:4px; justify-items:stretch; width:100%; }
    .avatar-option { width:100%; aspect-ratio:1/1; height:auto; box-sizing:border-box; border-radius:50%; display:flex; align-items:center;
      justify-content:center; font-size:clamp(18px,5vw,22px); cursor:pointer; border:2.5px solid transparent;
      transition:border-color 0.2s, transform 0.15s; }
    .avatar-option:hover { transform:scale(1.12); }
    .avatar-option.selected { border-color:var(--accent); box-shadow:0 0 0 3px rgba(126,184,154,0.2); }

    .btn-primary { width:100%; padding:12px; border:none; border-radius:10px; background:var(--accent);
      color:#fff; font-size:15px; font-weight:600; cursor:pointer; transition:background 0.2s, transform 0.1s; }
    .btn-primary:hover { background:var(--accent-hover); }
    .btn-primary:active { transform:scale(0.98); }
    .btn-primary:disabled { opacity:0.6; cursor:not-allowed; }

    .form-link { display:block; text-align:center; margin-top:12px; font-size:13px; color:var(--accent);
      cursor:pointer; text-decoration:none; }
    .form-link:hover { text-decoration:underline; }

    .toast { position:fixed; top:20px; left:50%; transform:translateX(-50%) translateY(-120px);
      padding:12px 24px; border-radius:10px; font-size:14px; font-weight:500; color:#fff;
      z-index:1000; transition:transform 0.3s ease; pointer-events:none; white-space:nowrap;
      box-shadow:0 4px 16px rgba(0,0,0,0.15); }
    .toast.show { transform:translateX(-50%) translateY(0); }
    .toast.success { background:#7EB89A; }
    .toast.error { background:#E06C6C; }
    .toast.info { background:#6B8EB5; }

    .forgot-view { display:none; }
    .forgot-view.active { display:block; }
    .reset-view { display:none; }
    .reset-view.active { display:block; }
    .back-btn { display:inline-flex; align-items:center; gap:4px; font-size:13px; color:var(--accent);
      cursor:pointer; margin-bottom:14px; background:none; border:none; padding:0; }
    .back-btn:hover { text-decoration:underline; }

    .spinner { display:inline-block; width:16px; height:16px; border:2px solid rgba(255,255,255,0.3);
      border-top-color:#fff; border-radius:50%; animation:spin 0.6s linear infinite;
      vertical-align:middle; margin-right:6px; }
    @keyframes spin { to { transform:rotate(360deg); } }

    .hint-text { font-size:12px; color:var(--text-secondary); text-align:center; margin-top:8px; line-height:1.5; }
    .footer { text-align:center; margin-top:16px; font-size:11px; color:var(--text-secondary); opacity:0.7; }
  </style>
</head>
<body>

<div class="container">
  <div class="logo-area">
    <img src="icons/icon-192.png" class="logo-icon" alt="自洽日程">
    <div class="logo-title">自洽日程</div>
    <div class="logo-sub">调适生活节奏的自留地</div>
  </div>

  <div class="card">
    <div class="tabs" id="tabs">
      <button class="tab-btn active" data-tab="login">登录</button>
      <button class="tab-btn" data-tab="register">注册</button>
    </div>

    <!-- ============ 登录表单 ============ -->
    <form class="form active" id="loginForm" autocomplete="on">
      <div class="form-group">
        <label class="form-label" for="loginName">账户名称</label>
        <input type="text" class="form-input" id="loginName" placeholder="输入你的账户名称" autocomplete="username" required>
      </div>

      <!-- 密码模式 -->
      <div id="loginPasswordMode">
        <div class="form-group">
          <label class="form-label" for="loginPassword">密码</label>
          <input type="password" class="form-input" id="loginPassword" placeholder="输入密码" autocomplete="current-password">
        </div>
      </div>

      <div class="remember-row">
        <input type="checkbox" id="rememberMe" checked>
        <label for="rememberMe">保持登录（一周内无需重新登录）</label>
      </div>

      <button type="submit" class="btn-primary" id="loginBtn">登录</button>
      <span class="form-link" id="showForgot">忘记密码？</span>
    </form>

    <!-- ============ 注册表单 ============ -->
    <form class="form" id="registerForm" autocomplete="on">
      <div class="form-group">
        <label class="form-label">选择头像</label>
        <div class="avatar-picker" id="avatarPicker"></div>
        <input type="hidden" id="regAvatar" value="0">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="regNickname">昵称 <span style="color:var(--error)">*</span></label>
          <input type="text" class="form-input" id="regNickname" placeholder="给自己起个名字" maxlength="7" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="regGender">性别 <span style="color:var(--error)">*</span></label>
          <select class="form-select" id="regGender" required>
            <option value="">请选择</option>
            <option value="female">女</option>
            <option value="male">男</option>
            <option value="other">其他</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="regName">账户名称 <span style="color:var(--error)">*</span>（登录账号）</label>
        <input type="text" class="form-input" id="regName" placeholder="3-20位，字母/数字/中文/下划线" autocomplete="username" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="regBirthday">生日</label>
          <input type="date" class="form-input" id="regBirthday">
        </div>
        <div class="form-group">
          <label class="form-label" for="regHeight">身高 (cm)</label>
          <input type="number" class="form-input" id="regHeight" placeholder="165" min="100" max="250" step="1">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="regPassword">密码（至少6位）<span style="color:var(--error)">*</span></label>
          <input type="password" class="form-input" id="regPassword" placeholder="至少6位密码" autocomplete="new-password" required minlength="6">
        </div>
        <div class="form-group">
          <label class="form-label" for="regConfirm">确认密码 <span style="color:var(--error)">*</span></label>
          <input type="password" class="form-input" id="regConfirm" placeholder="再次输入" autocomplete="new-password" required>
        </div>
      </div>

      <button type="submit" class="btn-primary" id="regBtn">注册</button>
      <span class="form-link" id="switchToLogin">已有账号？去登录</span>
    </form>

    <!-- ============ 忘记密码 ============ -->
    <div class="forgot-view" id="forgotView">
      <button class="back-btn" id="backToLogin">← 返回登录</button>
      <div class="form-group">
        <label class="form-label" for="forgotName">账户名称</label>
        <input type="text" class="form-input" id="forgotName" placeholder="输入你的账户名称" autocomplete="username" required>
      </div>
      <p class="hint-text">输入你的账户名称，获取密码重置码。</p>
      <button class="btn-primary" id="resetBtn">获取重置码</button>
      <div id="resetCodeArea" style="display:none;margin-top:16px;padding:14px;background:#f0f7ff;border:1px solid #b3d9ff;border-radius:8px;text-align:center;">
        <p style="margin:0 0 8px;font-size:13px;color:#555;">你的重置码（有效期 10 分钟）：</p>
        <p id="resetCodeDisplay" style="margin:0;font-size:28px;font-weight:bold;letter-spacing:6px;color:#1a73e8;font-family:monospace;"></p>
        <p style="margin:10px 0 0;font-size:12px;color:#888;">请复制此码，然后点击下方按钮前往设置新密码</p>
        <button type="button" class="btn-primary" id="goToResetBtn" style="margin-top:10px;">去设置新密码 →</button>
      </div>
    </div>

    <!-- ============ 设置新密码 ============ -->
    <div class="reset-view" id="resetView">
      <button class="back-btn" id="resetBackToLogin" type="button">← 返回登录</button>
      <h2 style="font-size:18px;margin:8px 0 4px;">设置新密码</h2>
      <p class="hint-text" id="resetEmailHint" style="text-align:left;"></p>
      <form id="resetForm">
        <div class="form-group">
          <label class="form-label" for="resetCodeInput">重置码（6位数字）</label>
          <input type="text" class="form-input" id="resetCodeInput" placeholder="输入页面显示的6位重置码" maxlength="6" autocomplete="off" inputmode="numeric" pattern="[0-9]{6}">
        </div>
        <div class="form-group">
          <label class="form-label" for="resetNewPwd">新密码（至少6位）</label>
          <input type="password" class="form-input" id="resetNewPwd" placeholder="至少6位密码" autocomplete="new-password" minlength="6">
        </div>
        <div class="form-group">
          <label class="form-label" for="resetConfirmPwd">确认新密码</label>
          <input type="password" class="form-input" id="resetConfirmPwd" placeholder="再次输入" autocomplete="new-password" minlength="6">
        </div>
        <button class="btn-primary" id="resetSubmitBtn" type="submit">确认重置</button>
        <p class="hint-text" id="resetError" style="color:var(--error);display:none;text-align:left;"></p>
      </form>
    </div>
  </div>

  <div class="footer">v2026.08.05 — 自洽日程</div>
</div>

<div class="toast" id="toast"></div>

<script>
// ==================== Supabase REST 配置 ====================
// 注：注册/登录不再依赖 Supabase Auth（邮箱），仅用 REST API 存取数据
var SUPABASE_URL = 'https://dyvzxlntyqebblewpihj.supabase.co';
var SUPABASE_KEY = 'sb_publishable_kSGB8khWFcMSemqJ1m6Rxw_pI4gGrhc';

// ==================== 预设头像 ====================
var AVATARS = [
  { emoji:'🌸', bg:'#FFE4E1' }, { emoji:'🌿', bg:'#E8F5E9' },
  { emoji:'☀️', bg:'#FFF8E1' }, { emoji:'🌙', bg:'#E3F2FD' },
  { emoji:'⭐', bg:'#FFF3E0' }, { emoji:'🦋', bg:'#E0F7FA' },
  { emoji:'🐱', bg:'#FCE4EC' }, { emoji:'🌈', bg:'#F3E5F5' },
  { emoji:'🍀', bg:'#C8E6C9' }, { emoji:'💜', bg:'#EDE7F6' },
  { emoji:'🌊', bg:'#BBDEFB' }, { emoji:'🔥', bg:'#FFEBEE' }
];

// ==================== 工具 ====================
function $(id) { return document.getElementById(id); }

function showToast(msg, type) {
  var t = $('toast');
  t.textContent = msg;
  t.className = 'toast ' + type + ' show';
  clearTimeout(t._timer);
  t._timer = setTimeout(function() { t.classList.remove('show'); }, 3000);
}

function setLoading(btn, loading) {
  if (loading) {
    btn.disabled = true;
    btn._txt = btn._txt || btn.textContent;
    btn.innerHTML = '<span class="spinner"></span>' + btn._txt;
  } else {
    btn.disabled = false;
    btn.innerHTML = btn._txt || btn.textContent;
  }
}

// ==================== Supabase REST 直连 ====================
function sbRest(method, path, body) {
  var headers = {
    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer ' + SUPABASE_KEY,
    'Content-Type': 'application/json'
  };
  if (body && method === 'POST') {
    headers['Prefer'] = 'resolution=merge-duplicates';
  }
  var opts = { method: method, headers: headers };
  if (body) opts.body = JSON.stringify(body);
  return fetch(SUPABASE_URL + '/rest/v1/' + path, opts).then(function(r) {
    if (!r.ok) return r.text().then(function(t) {
      var e = new Error('HTTP ' + r.status);
      try { var j = JSON.parse(t); e.message = j.message || j.error || t; } catch (_) { e.message = t; }
      throw e;
    });
    var ct = r.headers.get('content-type') || '';
    return ct.indexOf('application/json') >= 0 ? r.json() : r.text();
  });
}

function randomStr(len) {
  var chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
  var s = '';
  for (var i = 0; i < len; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}

// 简单的密码哈希（用于本地比较，不用于网络传输）
function hashPassword(pwd) {
  // 使用简单的 hash（生产环境建议用 bcrypt/scrypt）
  var hash = 0, i, chr;
  if (pwd.length === 0) return '';
  for (i = 0; i < pwd.length; i++) {
    chr = pwd.charCodeAt(i);
    hash = ((hash << 5) - hash) + chr;
    hash |= 0;
  }
  return 'h_' + Math.abs(hash).toString(36) + '_' + pwd.length;
}

function nameToLookupKey(name) { return 'profile_by_name_' + name.trim().toLowerCase(); }

// ==================== session / profile 存储 ====================
function saveAuthData(session, profile) {
  var data = {
    session: session,
    profile: profile,
    last_active: Date.now()
  };
  localStorage.setItem('wb_auth_data', JSON.stringify(data));
  // 兼容旧格式
  localStorage.setItem('sb_session', JSON.stringify(session));
}

// ==================== 头像选择器 ====================
function buildAvatarPicker() {
  var html = '';
  AVATARS.forEach(function(a, i) {
    var sel = i === 0 ? ' selected' : '';
    html += '<div class="avatar-option' + sel + '" data-idx="' + i +
      '" style="background:' + a.bg + '" onclick="selectAvatar(this, ' + i + ')">' +
      a.emoji + '</div>';
  });
  $('avatarPicker').innerHTML = html;
}

function selectAvatar(el, idx) {
  document.querySelectorAll('.avatar-option').forEach(function(o) { o.classList.remove('selected'); });
  el.classList.add('selected');
  $('regAvatar').value = idx;
}
buildAvatarPicker();

// ==================== Tab 切换 ====================
var tabsEl = $('tabs');
var forms = document.querySelectorAll('.form');
var forgotView = $('forgotView');

tabsEl.addEventListener('click', function(e) {
  if (!e.target.classList.contains('tab-btn')) return;
  var tab = e.target.dataset.tab;
  tabsEl.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
  e.target.classList.add('active');
  forms.forEach(function(f) { f.classList.remove('active'); });
  forgotView.classList.remove('active');
  if (tab === 'login') $('loginForm').classList.add('active');
  else $('registerForm').classList.add('active');
});

$('switchToLogin').addEventListener('click', function() {
  tabsEl.querySelector('[data-tab="login"]').click();
});

$('showForgot').addEventListener('click', function() {
  forms.forEach(function(f) { f.classList.remove('active'); });
  forgotView.classList.add('active');
});

$('backToLogin').addEventListener('click', function() {
  forgotView.classList.remove('active');
  $('loginForm').classList.add('active');
});

// 设置新密码视图
var resetView = $('resetView');
var resetAccount = '';
function showResetView() {
  forms.forEach(function(f) { f.classList.remove('active'); });
  forgotView.classList.remove('active');
  tabsEl.style.display = 'none';
  resetView.classList.add('active');
}
function hideResetView() {
  resetView.classList.remove('active');
  tabsEl.style.display = '';
  $('loginForm').classList.add('active');
}
$('resetBackToLogin').addEventListener('click', hideResetView);
$('resetForm').addEventListener('submit', function(e) {
  e.preventDefault();
  submitNewPassword();
});

// （短信验证码登录已移除：无真实短信服务，登录仅用账户名 + 密码）



// ==================== 通过手机号查找用户映射 ====================
function parseDataField(d) {
  // 兼容 JSONB（返回对象）和 TEXT（返回 JSON 字符串）两种列类型
  if (!d) return null;
  if (typeof d === 'string') {
    try { d = JSON.parse(d); } catch(e) { return null; }
  }
  return d;
}

function findUserByName(name) {
  var key = nameToLookupKey(name);
  return sbRest('GET', 'sync_store?group_key=eq.' + encodeURIComponent(key) + '&store=eq.wb_profile_lookup&select=data&limit=1', null)
    .then(function(arr) {
      if (arr && arr.length > 0) {
        return parseDataField(arr[0].data); // { user_id, account, email, session_key, password_hash }
      }
      return null;
    })
    .catch(function() { return null; });
}

// ==================== 获取用户完整 profile ====================
function fetchUserProfile(userId) {
  return sbRest('GET', 'sync_store?group_key=eq.profile_' + encodeURIComponent(userId) + '&store=eq.wb_user_profile&select=data&limit=1', null)
    .then(function(arr) {
      if (arr && arr.length > 0) {
        return parseDataField(arr[0].data);
      }
      return null;
    })
    .catch(function() { return null; });
}

// ==================== 登录表单提交 ====================
$('loginForm').addEventListener('submit', function(e) {
  e.preventDefault();
  var name = $('loginName').value.trim();

  if (!name) {
    showToast('请输入账户名称', 'error');
    return;
  }
  if (name.length < 3 || name.length > 20) {
    showToast('账户名称需 3-20 个字符', 'error');
    return;
  }
  if (!/^[一-龥A-Za-z0-9_]+$/.test(name)) {
    showToast('账户名称仅限中英文、数字和下划线', 'error');
    return;
  }

  loginWithPassword(name);
});

// ==================== 自签本地 session（不再依赖 Supabase Auth） ====================
function createLocalSession(userId, rememberMe) {
  var now = Math.floor(Date.now() / 1000);
  var expiresIn = rememberMe ? 7 * 86400 : 86400; // 7天或1天
  return {
    access_token: 'local_' + randomStr(40),
    token_type: 'bearer',
    expires_at: now + expiresIn,
    expires_in: expiresIn,
    refresh_token: 'local_refresh_' + randomStr(40),
    user: { id: userId },
    _local: true  // 标记：index.html 跳过 Supabase token 刷新
  };
}

// ==================== 密码登录 ====================
function loginWithPassword(name) {
  var password = $('loginPassword').value;

  if (!password) { showToast('请输入密码', 'error'); return; }

  setLoading($('loginBtn'), true);

  // 1. 通过账户名称查找用户映射
  findUserByName(name).then(function(userData) {
    if (!userData) {
      setLoading($('loginBtn'), false);
      showToast('该账户名称未注册，请先注册', 'error');
      return;
    }

    console.log('[Login] userData found:', { user_id: userData.user_id, account: userData.account, has_password_hash: !!userData.password_hash });

    // 2. 本地验证用户密码（不经过 Supabase Auth，无需邮箱验证！）
    var pwdHash = hashPassword(password);
    console.log('[Login] pwdHash=' + pwdHash + ', stored=' + userData.password_hash);

    if (userData.password_hash) {
      if (userData.password_hash !== pwdHash) {
        setLoading($('loginBtn'), false);
        showToast('密码错误', 'error');
        console.error('[Login] Password hash mismatch');
        return;
      }
      console.log('[Login] Password hash matched ✓');
    } else {
      console.warn('[Login] No password_hash stored — skipping local password check');
    }

    // 3. 自签本地 session，不再调用 Supabase signInWithPassword
    var session = createLocalSession(userData.user_id, $('rememberMe').checked);
    console.log('[Login] Local session created, expires_at=' + session.expires_at);

    setLoading($('loginBtn'), false);
    finishLogin(session, userData.user_id);
  }).catch(function(err) {
    setLoading($('loginBtn'), false);
    showToast('网络错误，请重试', 'error');
    console.error('Login error:', err);
  });
}

// ==================== 验证码登录 ====================
// （loginWithCode 已移除：短信验证码登录整体下线，仅保留账户名 + 密码）

// ==================== 登录完成 ====================
function finishLogin(session, userId) {
  // 从云端拉取完整用户 profile
  fetchUserProfile(userId).then(function(profile) {
    if (!profile) {
      // 降级：用 session 里的 metadata 或默认值
      profile = (session.user && session.user.user_metadata) || { nickname: '用户', avatar_idx: 0, gender: '' };
    }
    // 更新 last_active
    profile.last_active = new Date().toISOString();

    // 回写 profile 更新 last_active
    sbRest('POST', 'sync_store', {
      group_key: 'profile_' + userId,
      store: 'wb_user_profile',
      data: profile,
      updated_at: new Date().toISOString()
    }).catch(function() {});

    saveAuthData(session, profile);
    showToast('登录成功，即将跳转...', 'success');
    setTimeout(function() { window.location.href = 'index.html'; }, 600);
  }).catch(function() {
    // 降级
    var profile = (session.user && session.user.user_metadata) || { nickname: '用户', avatar_idx: 0, gender: '' };
    saveAuthData(session, profile);
    showToast('登录成功，即将跳转...', 'success');
    setTimeout(function() { window.location.href = 'index.html'; }, 600);
  });
}

// ==================== 注册 ====================
$('registerForm').addEventListener('submit', function(e) {
  e.preventDefault();

  var avatarIdx = parseInt($('regAvatar').value) || 0;
  var nickname = $('regNickname').value.trim();
  var gender = $('regGender').value;
  var name = $('regName').value.trim();
  var birthday = $('regBirthday').value;
  var height = parseFloat($('regHeight').value) || null;
  var password = $('regPassword').value;
  var confirmPwd = $('regConfirm').value;

  // 校验
  if (!nickname) { showToast('请输入昵称', 'error'); return; }
  if (nickname.length > 7) { showToast('昵称最多7个字符', 'error'); return; }
  if (!gender) { showToast('请选择性别', 'error'); return; }
  if (!name) { showToast('请输入账户名称', 'error'); return; }
  if (name.length < 3 || name.length > 20) { showToast('账户名称需 3-20 个字符', 'error'); return; }
  if (!/^[一-龥A-Za-z0-9_]+$/.test(name)) { showToast('账户名称仅限中英文、数字和下划线', 'error'); return; }
  // 注册完全不依赖 Supabase Auth（无邮箱、无 signUp）
  // 用本地 UUID 作为用户 ID，所有数据通过 sbRest (REST API) 直存
  if (password.length < 6) { showToast('密码至少6位', 'error'); return; }
  if (password !== confirmPwd) { showToast('两次密码不一致', 'error'); return; }

  setLoading($('regBtn'), true);

  // 生成本地 UUID 作为用户 ID（不经过 Supabase Auth）
  var userId = null;
  try { userId = crypto.randomUUID(); } catch (_) {
    userId = 'local_' + Date.now().toString(36) + '_' + randomStr(16);
  }
  var sessionKey = randomStr(24);
  var passwordHash = hashPassword(password);

  var profile = {
    nickname: nickname,
    avatar_idx: avatarIdx,
    avatar_emoji: AVATARS[avatarIdx].emoji,
    avatar_bg: AVATARS[avatarIdx].bg,
    gender: gender,
    account: name,
    birthday: birthday || null,
    height: height,
    created_at: new Date().toISOString(),
    last_active: new Date().toISOString()
  };

  // 先检查账户名称是否已注册
  findUserByName(name).then(function(existing) {
    if (existing) {
      setLoading($('regBtn'), false);
      showToast('该账户名称已注册，请直接登录', 'error');
      return Promise.reject('DUPLICATE');
    }

    // 直接用 REST API 存数据，不走 Supabase Auth
    // 第一步：存用户 profile
    return sbRest('POST', 'sync_store', {
      group_key: 'profile_' + userId,
      store: 'wb_user_profile',
      data: profile,
      updated_at: new Date().toISOString()
    });
  }).then(function() {
    // 第二步：存账户名→用户映射（含密码哈希）
    return sbRest('POST', 'sync_store', {
      group_key: nameToLookupKey(name),
      store: 'wb_profile_lookup',
      data: {
        user_id: userId,
        account: name,
        session_key: sessionKey,
        password_hash: passwordHash
      },
      updated_at: new Date().toISOString()
    });
  }).then(function() {
    // 第三步：自签本地 session 并保存，自动登录
    var session = createLocalSession(userId, true);
    saveAuthData(session, profile);
    setLoading($('regBtn'), false);
    showToast('注册成功，欢迎加入！', 'success');
    setTimeout(function() { window.location.href = 'index.html'; }, 600);
  }).catch(function(err) {
    if (typeof err === 'string') return; // 已处理
    setLoading($('regBtn'), false);
    showToast('网络错误，请重试', 'error');
    console.error('Register error:', err);
  });
});

// saveRegistrationData 已内联到注册流程中（见上方 doRegister），
// 不再需要独立函数。注册现在完全走本地 UUID + sbRest，无 Supabase Auth 依赖。

// ==================== 忘记密码（页面重置码模式） ====================
function generateResetCode() {
  return String(Math.floor(100000 + Math.random() * 900000));
}
var _resetPendingEmail = '';

$('resetBtn').addEventListener('click', function() {
  var name = $('forgotName').value.trim();
  if (!name) { showToast('请输入账户名称', 'error'); return; }

  setLoading($('resetBtn'), true);
  _resetPendingEmail = name;
  var code = generateResetCode();
  var expiresAt = Date.now() + 10 * 60 * 1000; // 10分钟有效

  // 重置码存本地：页面重置码模式本就是同一浏览器的连续流程，
  // 不需要写后端；之前写 wb_reset_codes 被 RLS 写白名单拦截导致失败。
  var storeKey = 'wb_reset_code_' + encodeURIComponent(name);
  try {
    localStorage.setItem(storeKey, JSON.stringify({ code: code, account: name, expires_at: expiresAt }));
  } catch (err) {
    setLoading($('resetBtn'), false);
    console.error('Store reset code error:', err);
    showToast('本地存储失败，请重试', 'error');
    return;
  }
  setLoading($('resetBtn'), false);
  // 页面上显示重置码
  $('resetCodeDisplay').textContent = code;
  $('resetCodeArea').style.display = 'block';
  showToast('重置码已生成，请在下方查看', 'success');
});

// "去设置新密码"按钮
$('goToResetBtn').addEventListener('click', function() {
  sessionStorage.setItem('resetMode', '1');
  sessionStorage.setItem('resetAccount', _resetPendingEmail);
  window.location.href = 'auth.html?mode=reset';
});

// ==================== 密码重置回调（支持邮件链接 + 页面重置码两种模式） ====================
function showResetError(msg) {
  var el = $('resetError');
  el.textContent = msg;
  el.style.display = 'block';
}

async function handlePasswordReset() {
  sessionStorage.setItem('resetMode', '1');
  showResetView();
  $('resetError').style.display = 'none';
  $('resetSubmitBtn').disabled = false;

  var params = new URLSearchParams(window.location.search);
  var tokenHash = params.get('token_hash');
  var type = params.get('type');

  // 模式A：邮件链接带回 token_hash → 已废弃（Supabase Auth 已移除）
  // 如需邮件重置密码功能，需另行实现邮件服务集成
  if (tokenHash && type === 'recovery') {
    showResetError('邮件重置链接已不可用，请使用页面重置码模式。');
    return;
  }

  // 模式B：页面重置码模式（从"去设置新密码"按钮跳转过来）
  resetAccount = sessionStorage.getItem('resetAccount') || params.get('account') || '';
  $('resetEmailHint').textContent = resetAccount ? ('账户名称：' + resetAccount) : '请输入注册时获取的重置码';
  // 确保重置码输入框可见
  $('resetCodeInput').parentElement.style.display = '';
}

async function submitNewPassword() {
  var pwd = $('resetNewPwd').value;
  var confirmPwd = $('resetConfirmPwd').value;
  if (!pwd || pwd.length < 6) { showToast('密码至少6位', 'error'); return; }
  if (pwd !== confirmPwd) { showToast('两次密码不一致', 'error'); return; }

  // 检查是否需要输入重置码（页面模式）
  var codeInput = $('resetCodeInput');
  var needCode = codeInput.parentElement.style.display !== 'none';
  if (needCode && !resetAccount) {
    showResetError('缺少账户信息，请重新获取重置码。'); return;
  }

  setLoading($('resetSubmitBtn'), true);
  try {
    // 如果是重置码模式，先验证码
    if (needCode && resetAccount) {
      var userCode = codeInput.value.trim();
      if (!userCode || userCode.length !== 6) {
        setLoading($('resetSubmitBtn'), false);
        showResetError('请输入6位数字重置码。'); return;
      }
      // 从本地取出存储的重置码（与生成端同源 localStorage）
      var storeKey = 'wb_reset_code_' + encodeURIComponent(resetAccount);
      var raw = null;
      try { raw = localStorage.getItem(storeKey); } catch (_) {}
      if (!raw) {
        setLoading($('resetSubmitBtn'), false);
        showResetError('未找到重置码记录，可能已过期或不存在。'); return;
      }
      var cd = null;
      try { cd = JSON.parse(raw); } catch (_) {}
      if (!cd || cd.code !== userCode || Date.now() > cd.expires_at) {
        setLoading($('resetSubmitBtn'), false);
        showResetError('重置码错误或已过期（10分钟有效），请重新获取。'); return;
      }
      // 验证通过，删除已使用的重置码
      try { localStorage.removeItem(storeKey); } catch (_) {}
    }

    // 查找用户并更新 password_hash
    var rows = await sbRest('GET', 'sync_store?store=eq.wb_profile_lookup' + (resetAccount ? '&data->>account=eq.' + encodeURIComponent(resetAccount) : '') + '&select=group_key,data');
    if (!rows || !rows.length) {
      setLoading($('resetSubmitBtn'), false);
      showToast('未找到该账户名称对应的账号', 'error');
      return;
    }
    var row = rows[0];
    var data = row.data;
    if (typeof data === 'string') { try { data = JSON.parse(data); } catch (_) {} }
    if (!data || typeof data !== 'object') {
      setLoading($('resetSubmitBtn'), false);
      showToast('数据异常，请重试', 'error');
      return;
    }
    data.password_hash = hashPassword(pwd);
    await sbRest('PATCH', 'sync_store?group_key=eq.' + encodeURIComponent(row.group_key) + '&store=eq.wb_profile_lookup', {
      data: data,
      updated_at: new Date().toISOString()
    });
    // 清除本地登录态（不再依赖 supabase.auth.signOut）
    try { localStorage.removeItem('wb_auth_data'); localStorage.removeItem('sb_session'); } catch (_) {}
    sessionStorage.removeItem('resetMode');
    setLoading($('resetSubmitBtn'), false);
    showToast('密码已重置，请用新密码登录', 'success');
    setTimeout(function() { window.location.href = 'auth.html'; }, 1500);
  } catch (e) {
    setLoading($('resetSubmitBtn'), false);
    showToast('重置失败：' + (e && e.message ? e.message : '请重试'), 'error');
    console.error('Reset password error:', e);
  }
}

// ==================== 自动检查登录态 ====================
(function() {
  // 优先处理密码重置回调（避免恢复会话被误判为已登录而跳转）
  var _sp = new URLSearchParams(window.location.search);
  var _inReset = _sp.get('mode') === 'reset' || /reset/.test(window.location.hash) || sessionStorage.getItem('resetMode') === '1';
  if (_inReset) { handlePasswordReset(); return; }

  // 检查新格式
  var authData = localStorage.getItem('wb_auth_data');
  if (authData) {
    try {
      var parsed = JSON.parse(authData);
      if (parsed.session && parsed.session.access_token) {
        var sevenDays = 7 * 24 * 60 * 60 * 1000;
        if (parsed.last_active && (Date.now() - parsed.last_active) < sevenDays) {
          // Token 过期检查
          if (parsed.session.expires_at && parsed.session.expires_at > Date.now() / 1000) {
            window.location.href = 'index.html';
            return;
          }
        }
      }
    } catch(e) {}
  }

  // 检查旧格式（兼容）
  var oldSession = localStorage.getItem('sb_session') || sessionStorage.getItem('sb_session');
  if (oldSession) {
    try {
      var s = JSON.parse(oldSession);
      if (s && s.access_token && s.expires_at && s.expires_at > Date.now() / 1000) {
        window.location.href = 'index.html';
        return;
      }
    } catch(e) {}
  }

  // 清除过期数据
  localStorage.removeItem('wb_auth_data');
  localStorage.removeItem('sb_session');
  sessionStorage.removeItem('sb_session');

  // 处理邮箱验证回调
  var hash = window.location.hash;
  if (hash) {
    var params = new URLSearchParams(hash.substring(1));
    if (params.get('type') === 'signup') {
      showToast('邮箱验证成功，请登录', 'success');
    }
    window.location.hash = '';
  }
})();
